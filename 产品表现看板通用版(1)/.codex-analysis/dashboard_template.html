<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品表现离线看板</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #172033;
      --muted: #687386;
      --border: #dfe5ef;
      --grid: #e9edf4;
      --primary: #2563eb;
      --primary-soft: #e8f0ff;
      --teal: #0f9f8f;
      --amber: #d89018;
      --purple: #7c5ce5;
      --red: #d54949;
      --green: #198754;
      --shadow: 0 8px 24px rgba(22, 34, 55, .07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0f1420;
        --panel: #171e2c;
        --panel-soft: #1d2637;
        --text: #eef3fb;
        --muted: #a9b4c7;
        --border: #303a4d;
        --grid: #2b3445;
        --primary: #79a6ff;
        --primary-soft: #1c3159;
        --teal: #53cabb;
        --amber: #f0b959;
        --purple: #a992ff;
        --red: #ff7a7a;
        --green: #54c98b;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
      font-size: 14px;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { max-width: 1600px; margin: 0 auto; padding: 24px; }
    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .hero h1 { margin: 0 0 6px; font-size: clamp(24px, 3vw, 36px); font-weight: 600; letter-spacing: -.02em; }
    .hero p { margin: 0; color: var(--muted); }
    .meta { text-align: right; color: var(--muted); white-space: nowrap; }
    .page-tabs {
      display: inline-flex;
      gap: 6px;
      padding: 6px;
      margin: 0 0 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 13px;
      box-shadow: var(--shadow);
    }
    .page-tabs button {
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      padding: 10px 18px;
      font-weight: 500;
    }
    .page-tabs button.active {
      background: var(--primary);
      color: #fff;
    }
    .app[data-view="main"] .compare-page-block { display: none; }
    .app[data-view="compare"] .main-page-block { display: none; }
    .panel, .kpi {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .filters {
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 12px;
      margin-bottom: 14px;
    }
    .filter-grid {
      display: grid;
      grid-template-columns: 130px 130px minmax(135px, 1fr) 105px 110px 125px minmax(135px, 1fr);
      gap: 8px;
      align-items: end;
    }
    .field { min-width: 0; }
    .field-label { display: block; margin: 0 0 4px; color: var(--muted); font-size: 11px; }
    input[type="date"], select, .multi summary {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--panel-soft);
      padding: 6px 9px;
      outline: none;
      font-size: 13px;
    }
    input:focus, select:focus, .multi summary:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent); }
    .multi { position: relative; }
    .multi summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .multi summary::-webkit-details-marker { display: none; }
    .multi summary::after { content: "⌄"; color: var(--muted); }
    .multi[open] summary::after { content: "⌃"; }
    .multi-menu {
      position: absolute;
      z-index: 60;
      top: calc(100% + 6px);
      left: 0;
      min-width: 100%;
      width: max-content;
      max-width: 320px;
      max-height: 310px;
      overflow: auto;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
    }
    .multi-actions { display: flex; gap: 6px; padding: 2px 2px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .mini-btn, .btn, .seg button {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-soft);
      padding: 7px 11px;
    }
    .mini-btn { padding: 4px 8px; font-size: 12px; }
    .btn:hover, .mini-btn:hover, .seg button:hover { border-color: var(--primary); }
    .option { display: flex; align-items: flex-start; gap: 8px; padding: 7px 4px; white-space: nowrap; }
    .option input { margin-top: 2px; accent-color: var(--primary); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
    .toolbar-left, .toolbar-right { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; padding: 6px 11px; }
    .seg button.active { color: #fff; background: var(--primary); }
    .status { color: var(--muted); }
    .kpi-grid { display: grid; grid-template-columns: repeat(8, minmax(135px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .kpi { padding: 12px; min-width: 0; }
    .kpi-label { color: var(--muted); font-size: 12px; margin-bottom: 7px; }
    .kpi-value { font-size: clamp(16px, 1.5vw, 22px); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi-note { margin-top: 5px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chart-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin-bottom: 16px; }
    .chart-grid.equal { grid-template-columns: 1fr 1fr; }
    .chart-panel { padding: 16px; min-width: 0; }
    .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .panel-title { margin: 0; font-size: 16px; font-weight: 600; }
    .panel-subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .legend { display: flex; flex-wrap: wrap; gap: 11px; color: var(--muted); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
    .metric-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; font-size: 12px; color: var(--muted); }
    .metric-controls label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .metric-controls input { accent-color: var(--primary); }
    .rank-controls { display: grid; grid-template-columns: minmax(110px, 1fr) minmax(130px, 1fr); gap: 8px; min-width: 260px; }
    .compare-panel { padding: 16px; margin-bottom: 16px; }
    .compare-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .compare-controls { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .compare-metrics { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .compare-metrics label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; padding: 5px 7px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-soft); }
    .compare-metrics input { accent-color: var(--primary); }
    .compare-actions { display: inline-flex; gap: 6px; margin-left: auto; }
    .compare-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .compare-card { padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel-soft); min-width: 0; }
    .compare-card-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .compare-body { display: grid; grid-template-columns: minmax(170px, .85fr) minmax(220px, 1.15fr); gap: 14px; align-items: center; }
    .compare-values { display: grid; gap: 8px; }
    .compare-value { min-width: 0; }
    .compare-value span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 2px; }
    .compare-value strong { display: block; overflow-wrap: anywhere; font-size: 18px; line-height: 1.25; }
    .compare-delta { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; padding-top: 2px; border-top: 1px dashed var(--border); }
    .compare-bars { display: grid; gap: 10px; }
    .compare-bar-row { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
    .compare-bar-track { height: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .compare-bar-fill { height: 100%; width: var(--w, 0%); border-radius: 999px; }
    .compare-bar-fill.a { background: var(--primary); }
    .compare-bar-fill.b { background: var(--teal); }
    .chart { width: 100%; min-height: 310px; position: relative; }
    .chart svg { display: block; width: 100%; height: 310px; overflow: visible; }
    .chart text { fill: var(--muted); font-size: 10px; }
    .chart .axis, .chart .gridline { stroke: var(--grid); stroke-width: 1; }
    .chart .zero { stroke: var(--muted); stroke-width: 1; }
    .chart .hit { fill: transparent; cursor: crosshair; }
    .tooltip {
      position: absolute;
      z-index: 30;
      pointer-events: none;
      display: none;
      min-width: 130px;
      padding: 8px 10px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      font-size: 12px;
    }
    .tooltip strong { display: block; margin-bottom: 5px; }
    .bar-list { display: grid; gap: 10px; padding-top: 4px; }
    .bar-row { display: grid; grid-template-columns: minmax(110px, 1.25fr) 3fr auto; gap: 10px; align-items: center; }
    .bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 12px; background: var(--panel-soft); border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--primary); border-radius: 6px; }
    .bar-value { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar-index { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
    .table-panel { padding: 16px; }
    .audit-list { margin: 8px 0 0; padding-left: 18px; }
    .table-wrap { overflow-x: auto; position: relative; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th, td { padding: 10px 9px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    th:first-child, td:first-child { text-align: left; width: 220px; min-width: 220px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
    th:nth-child(2), td:nth-child(2) { text-align: left; width: 260px; min-width: 260px; max-width: 260px; }
    th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { position: sticky; background: var(--panel); z-index: 6; }
    th:first-child, td:first-child { left: 0; }
    th:nth-child(2), td:nth-child(2) { left: 220px; box-shadow: 8px 0 12px rgba(22, 34, 55, .05); }
    th:first-child, th:nth-child(2) { z-index: 8; }
    th { color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; user-select: none; }
    th:hover { color: var(--primary); }
    tbody tr:hover { background: var(--panel-soft); }
    .cell-main { display: block; }
    .cell-compare { display: block; margin-top: 5px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .label-with-bd { cursor: help; text-decoration: underline dotted color-mix(in srgb, var(--muted) 65%, transparent); text-underline-offset: 4px; }
    .note-cell { min-width: 260px; white-space: normal; }
    .note-input { width: 100%; min-height: 42px; resize: vertical; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-soft); color: var(--text); padding: 7px 8px; outline: none; font-size: 12px; }
    .note-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }
    .negative { color: var(--red); }
    .positive { color: var(--green); }
    .empty { display: grid; place-items: center; min-height: 220px; color: var(--muted); }
    .foot { margin: 14px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.7; }
    @media (max-width: 1200px) {
      .filter-grid { grid-template-columns: repeat(3, 1fr); }
      .kpi-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 820px) {
      .app { padding: 14px; }
      .hero { align-items: flex-start; flex-direction: column; }
      .meta { text-align: left; white-space: normal; }
      .page-tabs { display: flex; }
      .page-tabs button { flex: 1; padding-left: 10px; padding-right: 10px; }
      .filter-grid { grid-template-columns: repeat(2, 1fr); }
      .compare-head { flex-direction: column; }
      .compare-controls { grid-template-columns: repeat(2, 1fr); }
      .compare-body { grid-template-columns: 1fr; }
      .compare-grid { grid-template-columns: 1fr; }
      .chart-grid, .chart-grid.equal { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .filter-grid { grid-template-columns: 1fr; }
      .kpi-grid { grid-template-columns: 1fr 1fr; }
      .bar-row { grid-template-columns: 1fr auto; }
      .bar-track { grid-column: 1 / -1; grid-row: 2; }
    }
  </style>
</head>
<body>
<main class="app" id="app" data-view="main">
  <header class="hero">
    <div>
      <h1>产品表现离线看板</h1>
      <p>父体与系列表现 · 统一使用汇总分子 ÷ 汇总分母</p>
    </div>
    <div class="meta" id="meta"></div>
  </header>

  <nav class="page-tabs" aria-label="看板页面切换">
    <button type="button" class="active" data-view="main">整体表现看板</button>
    <button type="button" data-view="compare">自定义时间对比</button>
  </nav>

  <section class="panel filters" aria-label="筛选条件">
    <div class="filter-grid">
      <label class="field"><span class="field-label">开始日期</span><input id="dateFrom" type="date"></label>
      <label class="field"><span class="field-label">结束日期</span><input id="dateTo" type="date"></label>
      <div class="field"><span class="field-label">统计店铺（原始数据）</span><details class="multi" data-filter="store"><summary>全部店铺</summary><div class="multi-menu"></div></details></div>
      <div class="field"><span class="field-label">国家</span><details class="multi" data-filter="country"><summary>全部国家</summary><div class="multi-menu"></div></details></div>
      <div class="field"><span class="field-label">阶段</span><details class="multi" data-filter="stage"><summary>全部阶段</summary><div class="multi-menu"></div></details></div>
      <div class="field"><span class="field-label">系列</span><details class="multi" data-filter="series"><summary>全部系列</summary><div class="multi-menu"></div></details></div>
      <div class="field"><span class="field-label">父体</span><details class="multi" data-filter="parent"><summary>全部父体</summary><div class="multi-menu"></div></details></div>
    </div>
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="field-label" style="margin:0">时间粒度</span>
        <div class="seg" id="granularity" role="group" aria-label="时间粒度">
          <button type="button" data-value="day" class="active">日</button>
          <button type="button" data-value="week">周</button>
          <button type="button" data-value="month">月</button>
        </div>
        <span class="status" id="filterStatus"></span>
      </div>
      <div class="toolbar-right"><button class="btn" id="resetFilters" type="button">重置筛选</button></div>
    </div>
  </section>

  <section class="kpi-grid main-page-block" id="kpis" aria-label="关键指标"></section>

  <section class="panel compare-panel compare-page-block" aria-label="自定义时间对比">
    <div class="compare-head">
      <div>
        <h2 class="panel-title">自定义时间对比</h2>
        <div class="panel-subtitle" id="compareStatus">选择两个任意时间段进行对比；顶部店铺、国家、阶段、系列、父体筛选继续生效，时间以本页 A/B 为准</div>
      </div>
    </div>
    <div class="compare-controls">
      <label class="field"><span class="field-label">时间段A开始</span><input id="compareAFrom" type="date"></label>
      <label class="field"><span class="field-label">时间段A结束</span><input id="compareATo" type="date"></label>
      <label class="field"><span class="field-label">时间段B开始</span><input id="compareBFrom" type="date"></label>
      <label class="field"><span class="field-label">时间段B结束</span><input id="compareBTo" type="date"></label>
    </div>
    <div class="compare-metrics" id="compareMetricControls"></div>
    <div class="compare-grid" id="compareCards"></div>
  </section>

  <section class="chart-grid main-page-block">
    <article class="panel chart-panel">
      <div class="panel-head">
        <div><h2 class="panel-title">销售、利润与广告投入趋势</h2><div class="panel-subtitle" id="trendSubtitle"></div></div>
        <div class="metric-controls" id="trendMetricControls" aria-label="趋势对比指标"></div>
      </div>
      <div class="chart" id="moneyChart" aria-label="销售利润广告投入趋势图"></div>
    </article>
    <article class="panel chart-panel">
      <div class="panel-head">
        <div><h2 class="panel-title">转化率趋势</h2><div class="panel-subtitle">订单、销量、广告与自然转化率</div></div>
        <div class="legend"><span><i class="swatch" style="background:var(--primary)"></i>订单</span><span><i class="swatch" style="background:var(--teal)"></i>销量</span><span><i class="swatch" style="background:var(--amber)"></i>广告</span><span><i class="swatch" style="background:var(--purple)"></i>自然</span></div>
      </div>
      <div class="chart" id="conversionChart" aria-label="转化率趋势图"></div>
    </article>
  </section>

  <section class="chart-grid equal main-page-block">
    <article class="panel chart-panel">
      <div class="panel-head">
        <div><h2 class="panel-title">订单来源结构</h2><div class="panel-subtitle">广告订单与自然订单占比</div></div>
        <div class="legend"><span><i class="swatch" style="background:var(--purple)"></i>广告订单</span><span><i class="swatch" style="background:var(--teal)"></i>自然订单</span></div>
      </div>
      <div class="chart" id="orderMixChart" aria-label="订单来源结构图"></div>
    </article>
    <article class="panel chart-panel">
      <div class="panel-head">
        <div><h2 class="panel-title" id="rankTitle">父体净销售额排名</h2><div class="panel-subtitle">当前筛选范围完整排名</div></div>
        <div class="rank-controls">
          <label class="field"><span class="field-label">排名维度</span><select id="rankDimension"><option value="parent">父体</option><option value="series">系列</option><option value="stage">阶段</option><option value="store">统计店铺</option></select></label>
          <label class="field"><span class="field-label">排名指标</span><select id="rankMetric"><option value="netSales">净销售额</option><option value="profit">毛利润</option><option value="spend">广告花费</option><option value="acos">ACOS</option><option value="acoas">TACOS</option><option value="orders">订单量</option><option value="units">销量</option></select></label>
        </div>
      </div>
      <div class="bar-list" id="rankChart" aria-label="净销售额排名"></div>
    </article>
  </section>

  <section class="panel table-panel main-page-block">
    <div class="panel-head">
      <div><h2 class="panel-title" id="tableTitle">父体表现明细</h2><div class="panel-subtitle">点击表头排序；父体列悬停显示BD排期；数据说明自动保存；横向滚动时前两列固定</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </section>

  <p class="foot" id="footnote"></p>
</main>

<script>
const DASHBOARD_DATA = __DATA_JSON__;
const rows = DASHBOARD_DATA.rows;
const meta = DASHBOARD_DATA.meta;
const dims = {store:"统计店铺", country:"国家", stage:"阶段", series:"系列", parent:"父体"};
const metricKeys = ["units","sales","orders","netSales","b2bUnits","b2bOrders","profit","returns","sessionsBrowser","sessionsMobile","sessions","impressions","clicks","spend","adSales","adOrders","naturalClicks","naturalOrders"];
const trendMetrics = {
  netSales:{label:"净销售额",type:"money",color:"var(--primary)"},
  sales:{label:"销售额",type:"money",color:"var(--teal)"},
  profit:{label:"毛利润",type:"money",color:"var(--green)"},
  spend:{label:"广告花费",type:"money",color:"var(--amber)"},
  adSales:{label:"广告销售额",type:"money",color:"var(--purple)"}
};
const rankMetrics = {
  netSales:{label:"净销售额",type:"money"},
  profit:{label:"毛利润",type:"money"},
  spend:{label:"广告花费",type:"money"},
  acos:{label:"ACOS",type:"pct"},

function calculate(a){

function emptyAgg(label=""){

function addTo(a,r){

function aggregate(items,keyFn){
  const map=new Map();
  items.forEach(r=>{
    const key=keyFn(r);

function dateAdd(iso,days){
  const d=new Date(iso+"T00:00:00Z");
  d.setUTCDate(d.getUTCDate()+days);
  return d.toISOString().slice(0,10);
}
function dateSpanDays(from,to){
  const start=new Date(from+"T00:00:00Z"), end=new Date(to+"T00:00:00Z");
  return Math.floor((end-start)/86400000)+1;
}
function previousRange(from,to){
  const a=from<=to?from:to, b=from<=to?to:from;
  const days=dateSpanDays(a,b);
  const prevTo=dateAdd(a,-1);
  const prevFrom=dateAdd(prevTo,1-days);
  return {from:prevFrom,to:prevTo,days};
}
function rangeHasCompleteDates(from,to){
  if(from<meta.minDate || to>meta.maxDate) return false;
  const expected=dateSpanDays(from,to);
  const seen=new Set(rows.filter(r=>r.date>=from && r.date<=to).map(r=>r.date));
  return seen.size===expected;
}
function rowsInRangeWithDimensionFilters(from,to){
  return rows.filter(r => r.date>=from && r.date<=to &&
    Object.keys(dims).every(k => state.filters[k].has(r[k])));
}
function previousGroups(dim){
  const prev=previousRange(state.dateFrom,state.dateTo);
  if(!rangeHasCompleteDates(prev.from,prev.to)) return {complete:false,map:new Map(),range:prev};
  return {complete:true,map:new Map(aggregate(rowsInRangeWithDimensionFilters(prev.from,prev.to),r=>r[dim]).map(d=>[d.label,d])),range:prev};
}

function compareDelta(a,b,type){
  if(!Number.isFinite(a) || !Number.isFinite(b)) return {text:"-", cls:""};
  const diff=a-b;
  if(type==="pct") return {text:`${diff>=0?"+":""}${(diff*100).toFixed(2)} pct`, cls:diff>=0?"positive":"negative"};
  const pct=b?safeDiv(diff,Math.abs(b)):NaN;
  return {text:`${diff>=0?"+":""}${formatMetric(diff,type)}${Number.isFinite(pct)?` · ${pct>=0?"+":""}${(pct*100).toFixed(1)}%`:""}`, cls:diff>=0?"positive":"negative"};
}
function renderCompare(){

  });
  svg+="</svg><div class='tooltip'></div>";el.innerHTML=svg;
  bindTooltip(el,data,d=>`<strong>${esc(d.label)}</strong>订单转化率：${fmtPct(d.orderCvr)}<br>销量转化率：${fmtPct(d.unitCvr)}<br>广告转化率：${fmtPct(d.adCvr)}<br>自然转化率：${fmtPct(d.naturalCvr)}<br>BD ASIN：${fmtNum(d.bdAsinCount)}`);
}
function bindTooltip(el,data,html){
  const tip=el.querySelector(".tooltip");
  el.querySelectorAll(".hit").forEach(hit=>{
    hit.addEventListener("mouseenter",()=>{tip.innerHTML=html(data[+hit.dataset.i]);tip.style.display="block";});
    hit.addEventListener("mousemove",e=>{const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;tip.style.left=Math.max(4,Math.min(r.width-tw-4,e.clientX-r.left+10))+"px";tip.style.top=Math.max(4,Math.min(r.height-th-4,e.clientY-r.top-th-10))+"px";});
    hit.addEventListener("mouseleave",()=>tip.style.display="none");
  });
}
function rankChart(groups,dim,metricKey){
  const metric=rankMetrics[metricKey] || rankMetrics.netSales;
  const data=[...groups].sort((a,b)=>(b[metricKey]||0)-(a[metricKey]||0));
  document.getElementById("rankTitle").textContent=`${dims[dim]}${metric.label}排名`;
  const el=document.getElementById("rankChart");
  if(!data.length){el.innerHTML='<div class="empty">当前筛选无数据</div>';return;}
  const max=Math.max(...data.map(d=>Math.max(0,d[metricKey]||0)),1);
  el.innerHTML=data.map((d,i)=>`<div class="bar-row" aria-label="${esc(d.label)} ${formatMetric(d[metricKey],metric.type)}"><div class="bar-label"><span class="bar-index">${i+1}.</span> ${esc(d.label)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.max(0,d[metricKey]||0)/max*100}%"></div></div><div class="bar-value">${formatMetric(d[metricKey],metric.type)}</div></div>`).join("");
}
const columns=[
  ["label","维度","text"],["note","数据说明","note"],["netSales","净销售额","money"],["profit","订单毛利润","money"],["margin","毛利率","pct"],["spend","广告花费","money"],["acos","ACOS","pct"],["acoas","TACOS","pct"],["units","销量","num"],["orders","订单量","num"],["orderCvr","订单转化率","pct"],["unitCvr","销量转化率","pct"],["adShare","广告占比","pct"],["returnRate","退货率","pct"],["bdAsinCount","BD ASIN","num"]
];
function formatPreviousValue(previous,type){
  if(!Number.isFinite(previous)) return "-";
  const value=type==="money"?fmtMoney2.format(previous||0):type==="pct"?fmtPct(previous):fmtNum(previous||0);
  return value;
}
function bdScheduleText(label,dim){
  if(dim!=="parent") return "-";
  const items=meta.bdScheduleByParent?.[label] || [];
  return items.length ? items.join("\n") : "-";
}
function renderTable(groups,dim,prevInfo){
  document.getElementById("tableTitle").textContent=`${dims[dim]}表现明细`;
  document.getElementById("tableHead").innerHTML=columns.map(c=>`<th data-key="${c[0]}">${c[1]}${c[2]!=="note"&&tableSort.key===c[0]?(tableSort.dir>0?" ↑":" ↓"):""}</th>`).join("");
  const data=[...groups].sort((a,b)=>{
    const av=a[tableSort.key],bv=b[tableSort.key];
    return typeof av==="string"?av.localeCompare(bv,"zh-CN")*tableSort.dir:((av||0)-(bv||0))*tableSort.dir;
  });
  const format=(v,t,d,key)=>{
    if(t==="note") return dim==="parent"?`<textarea class="note-input" data-parent="${esc(d.label)}" placeholder="填写该父体的数据说明">${esc(safeGetNote(d.label))}</textarea>`:`<span class="text-muted">切换到父体维度填写</span>`;
    if(t==="text") return `<span class="label-with-bd" title="${esc(bdScheduleText(d.label,dim))}">${esc(v)}</span>`;
    const main=t==="money"?fmtMoney2.format(v||0):t==="pct"?fmtPct(v):fmtNum(v||0);
    const prev=prevInfo?.complete ? prevInfo.map.get(d.label) : null;
    const previousText=prev ? formatPreviousValue(prev[key],t) : "-";
    return `<span class="cell-main">${main}</span><span class="cell-compare">${previousText}</span>`;
  };
  document.getElementById("tableBody").innerHTML=data.map(d=>`<tr>${columns.map(c=>`<td class="${c[2]==="note"?"note-cell":""} ${c[0]==="profit"||c[0]==="margin"?(d[c[0]]<0?"negative":"positive"):""}">${format(d[c[0]],c[2],d,c[0])}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${columns.length}">当前筛选无数据</td></tr>`;
  document.querySelectorAll("#tableBody .note-input").forEach(input=>{
    input.addEventListener("input",()=>safeSetNote(input.dataset.parent,input.value));
  });
  document.querySelectorAll("#tableHead th").forEach(th=>th.addEventListener("click",()=>{
    const key=th.dataset.key;
    if(key==="note") return;
    if(tableSort.key===key)tableSort.dir*=-1;else tableSort={key,dir:key==="label"?1:-1};
    renderTable(groups,dim,prevInfo);
  }));
}
function safeGetNote(parent){
  try { return localStorage.getItem(noteStorageKey(parent)) || ""; }
  catch { return ""; }
}
function safeSetNote(parent,value){
  try { localStorage.setItem(noteStorageKey(parent), value); }
  catch {}
}
function renderAudit(){
  const counts=meta.auditCounts || {};
  const items=[
    ["产品表现未匹配售卖产品ASIN",counts.sourceOnlyAsins||0],
    ["售卖产品本期未出现在产品表现",counts.mappingOnlyAsins||0],
    ["售卖产品重复ASIN",counts.duplicateMappingAsins||0],
    ["BD父体未匹配售卖产品",counts.bdParentsWithoutProduct||0],
    ["售卖产品父体无BD排期",counts.productParentsWithoutBd||0]
  ];
  return `<ul class="audit-list">${items.map(([label,value])=>`<li>${label}：${fmtNum(value)}</li>`).join("")}</ul>`;
}
function render(){
  state.dateFrom=document.getElementById("dateFrom").value||meta.minDate;
  state.dateTo=document.getElementById("dateTo").value||meta.maxDate;
  state.rankDimension=document.getElementById("rankDimension").value;
  state.rankMetric=document.getElementById("rankMetric").value;
  const items=filteredRows(), t=total(items);
  const time=aggregate(items,r=>periodKey(r.date)).sort((a,b)=>a.label.localeCompare(b.label));
  const groups=aggregate(items,r=>r[state.rankDimension]);
  const prevInfo=previousGroups(state.rankDimension);
  document.getElementById("filterStatus").textContent=`${fmtNum(items.length)} 条明细 · ${fmtNum(t.asin.size)} 个 ASIN · BD ${fmtNum(t.bdAsinCount)} 个`;
  document.getElementById("trendSubtitle").textContent=`${state.dateFrom} 至 ${state.dateTo}`;
  renderKpis(t); renderCompare(); moneyChart(time); orderMixChart(time); conversionChart(time); rankChart(groups,state.rankDimension,state.rankMetric); renderTable(groups,state.rankDimension,prevInfo);
}

document.getElementById("meta").innerHTML=`数据日期 ${meta.minDate} 至 ${meta.maxDate}<br>${fmtNum(meta.mappedRows)} 条已映射明细 · ${fmtNum(meta.mappedAsins)} 个售卖 ASIN · BD父体 ${fmtNum(meta.bdMatchedParents||0)} 个`;
document.getElementById("footnote").innerHTML=`口径：TACOS＝广告花费÷净销售额；订单毛利率＝订单毛利润÷净销售额；其他比率均以当前筛选范围的汇总分子÷汇总分母计算。BD时间按 BD活动表 的父体 + 开始/结束日期同步到产品表现 ASIN。每次运行先读取售卖产品-数据源与BD活动表，并进行新增/减少核对。仅纳入售卖产品表已映射 ASIN，统计店铺取自原始产品表现数据。源文件：${esc(meta.sourceFile)}；售卖产品：${esc(meta.productFile||"")}；BD活动：${esc(meta.bdFile||"")}。${renderAudit()}`;
document.getElementById("dateFrom").value=meta.minDate;
document.getElementById("dateTo").value=meta.maxDate;
Object.keys(dims).forEach(createMulti);
createTrendMetricControls();
initCompareDates();
createCompareMetricControls();
document.querySelectorAll(".page-tabs button").forEach(btn=>btn.addEventListener("click",()=>setView(btn.dataset.view)));
document.getElementById("dateFrom").addEventListener("change",render);
document.getElementById("dateTo").addEventListener("change",render);
["compareAFrom","compareATo","compareBFrom","compareBTo"].forEach(id=>document.getElementById(id).addEventListener("change",renderCompare));
document.getElementById("rankDimension").addEventListener("change",render);
document.getElementById("rankMetric").addEventListener("change",render);
document.getElementById("resetFilters").addEventListener("click",resetFilters);
document.querySelectorAll("#granularity button").forEach(b=>b.addEventListener("click",()=>{
  state.granularity=b.dataset.value;
  document.querySelectorAll("#granularity button").forEach(x=>x.classList.toggle("active",x===b));
  render();
}));
document.addEventListener("click",e=>{if(!e.target.closest(".multi"))document.querySelectorAll(".multi[open]").forEach(x=>x.open=false);});
render();
</script>
</body>
